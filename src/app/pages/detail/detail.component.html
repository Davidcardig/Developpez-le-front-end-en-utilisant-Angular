<div class="container">
	@if (showBack) {
  <button type="button" (click)="goHome()">Back Home</button>
}

  <h2 class="title" >{{ country }}</h2>

  <div class="summary-cards">
    @for (card of summaryCards; track card) {
      <app-summary-card [label]="card.name" [value]="card.value"></app-summary-card>
    }
  </div>


    <div class="chart-container">
		<ngx-charts-line-chart
			[results]="medalsSeries"
			[xAxis]="true"
			[yAxis]="true"
      [view]="chartView"
			[showXAxisLabel]="true"
			[showYAxisLabel]="true"
			[xAxisLabel]="'Dates'"
			[yAxisLabel]="'Medals'"
            [animations]="true"
		>
		</ngx-charts-line-chart>
	</div>
</div>
